[package]
name = "loom"
version = "0.2.0"
edition = "2021"

[lib]
name = "loom"
path = "lib.rs"

[[bin]]
name = "loom"
path = "main.rs"

[dependencies]
pest = "2.8"
pest_derive = "2.8"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
rayon = "1.12"
