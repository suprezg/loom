[package]
name = "loom"
version = "0.1.0"
edition = "2021"

[lib]
name = "loom"
path = "lib.rs"

[[bin]]
name = "loom"
path = "main.rs"

[dependencies]
pest = "2.7"
pest_derive = "2.7"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.4", features = ["derive"] }
rayon = "1.8"
